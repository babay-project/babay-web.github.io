function translate(){document.documentElement.lang=english?'en':'id';$('language').textContent=english?'Indonesia':'English';$('heading').textContent=english?'Chat archive locked':'Arsip chat terkunci';$('intro').textContent=english?'Enter your password to open the conversation.':'Masukkan password untuk membuka percakapan.';$('password').placeholder=english?'Enter password':'Masukkan password';$('submit').textContent=english?'Open conversation':'Buka percakapan';$('show').textContent=$('password').type==='password'?(english?'Show':'Lihat'):(english?'Hide':'Sembunyikan');$('note').textContent=english?'The conversation is encrypted. A password is required each time this file is opened.':'Isi percakapan terenkripsi. Password diperlukan setiap kali file dibuka.';$('lock').textContent=english?'Lock again':'Kunci kembali';$('status').textContent=''}
$('language').onclick=()=>{if(!busy){english=!english;translate()}};$('show').onclick=()=>{$('password').type=$('password').type==='password'?'text':'password';translate()};
$('unlock').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;if(!globalThis.crypto?.subtle){$('status').textContent=english?'Open this file in a recent Chrome, Edge or Firefox browser.':'Buka file ini di browser Chrome, Edge, atau Firefox versi terbaru.';return}busy=true;$('submit').disabled=true;$('status').textContent=english?'Unlocking…':'Membuka…';let password=$('password').value;try{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);password='';const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv)},key,decode(payload.data));$('password').value='';$('password').type='password';$('chat').srcdoc=new TextDecoder().decode(bytes);new Uint8Array(bytes).fill(0);$('chat').style.display='block';$('gate').hidden=true;$('lock').style.display='block';document.title=english?'Chat archive':'Arsip Chat';$('status').textContent=''}catch(err){$('status').textContent=english?'Incorrect password, or the file is damaged. Please try again.':'Password salah atau file rusak. Silakan coba lagi.';$('password').select()}finally{password='';busy=false;$('submit').disabled=false}});
$('lock').onclick=()=>{$('chat').srcdoc='';$('chat').style.display='none';$('lock').style.display='none';$('gate').hidden=false;document.title='Arsip Chat · Terkunci';translate();$('password').focus()};
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if(e.key==='F12'||((e.ctrlKey||e.metaKey)&&(['u','s'].includes(e.key.toLowerCase())||(e.shiftKey&&['i','j','c'].includes(e.key.toLowerCase())))))e.preventDefault()},true);
</script></body></html>
