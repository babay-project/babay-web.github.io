<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CapCut Pro Generator</title>

    <meta property="og:title" content="PANDUAN LENGKAP: CAPCUT PRO TEAM WORKSPACE" />
    <meta property="og:description" content="Informasi sistem Renew berkala 7 hari, pengisian kredit AI, dan syarat garansi resmi Babayshop." />
    <meta property="og:url" content="https://babay.web.id/informasi-capcut-renew" />
    <meta property="og:image" content="https://babay.web.id/assets/images/thumbnail-capcut.jpg" />
    <meta property="og:type" content="website" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: "Inter", sans-serif; }
      .galaxy-background {
        background: linear-gradient(135deg, #0f172a, #1e3a8a, #000000);
        background-size: cover;
      }
    </style>
  </head>
  <body class="galaxy-background text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-lg bg-slate-900/90 backdrop-blur-md rounded-2xl shadow-2xl border border-blue-500/20 p-6 md:p-8">
      <div class="text-center mb-8">
        <h1 id="pageTitle" class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">
          CAPCUT PRO GENERATOR
        </h1>
        <p class="text-slate-400 text-sm mt-1">Babayshop.my.id</p>
      </div>

      <form id="notaForm" class="space-y-5">
        <div>
          <label class="block mb-2 text-xs font-semibold text-slate-400 uppercase">Jenis CapCut Pro</label>
          <select id="jenisLayanan" required class="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-lg p-3 outline-none focus:border-blue-500">
            <option value="renew" selected>Renew</option>
            <option value="direct">Direct</option>
          </select>
        </div>

        <div>
          <label class="block mb-2 text-xs font-semibold text-slate-400 uppercase">Durasi Paket</label>
          <select id="durasi" required class="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-lg p-3 outline-none focus:border-blue-500"></select>
        </div>

        <div id="customDurasiContainer" class="hidden">
          <input type="text" id="customDurasi" placeholder="Input manual durasi..." class="w-full bg-slate-800 border border-blue-500/30 text-white text-sm rounded-lg p-3 outline-none focus:border-blue-500" />
        </div>

        <div>
          <label class="block mb-2 text-xs font-semibold text-slate-400 uppercase">Masa Garansi</label>
          <div class="flex gap-2">
            <input type="number" id="angkaGaransi" min="1" required placeholder="Jumlah" class="w-1/3 bg-slate-800 border border-slate-700 text-white text-sm rounded-lg p-3 outline-none focus:border-blue-500" />
            <select id="satuanGaransi" required class="w-2/3 bg-slate-800 border border-slate-700 text-white text-sm rounded-lg p-3 outline-none focus:border-blue-500">
              <option value="hari" selected>Hari</option>
              <option value="bulan">Bulan</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block mb-2 text-xs font-semibold text-slate-400 uppercase">Data Akun</label>
          <input type="text" id="dataAkun" required autocomplete="off" placeholder="email@gmail.com | Password" class="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-lg p-3 outline-none focus:border-blue-500" />
          <p class="text-[11px] text-slate-500 mt-2">Gunakan format: email | password</p>
          <p id="akunError" class="hidden text-xs text-red-400 mt-2">Format salah. Gunakan: email | password</p>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition-all shadow-lg">
          GENERATE NOTA ✨
        </button>
      </form>

      <div id="outputSection" class="mt-8 hidden">
        <textarea id="notaOutput" rows="20" class="w-full bg-black border border-slate-800 text-slate-300 text-sm rounded-lg p-4 font-mono leading-relaxed outline-none" readonly></textarea>
        <div class="mt-4 flex gap-3">
          <button type="button" id="editButton" class="flex-1 bg-slate-700 text-white text-xs py-3 rounded-xl">EDIT</button>
          <button type="button" id="copyButton" class="flex-1 bg-green-600 text-white text-xs py-3 rounded-xl font-bold">SALIN NOTA 📋</button>
        </div>
      </div>
    </div>

    <div class="mt-6 text-center">
      <a href="https://babay.web.id/informasi-capcut-renew" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 text-xs text-blue-400 hover:text-blue-300 bg-slate-900/60 border border-slate-800 hover:border-blue-500/50 px-4 py-2 rounded-full transition-all backdrop-blur-sm shadow-xl">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Buka Halaman Panduan Resmi CapCut Renew ↗
      </a>
    </div>

    <script>
      const jenisLayananEl = document.getElementById("jenisLayanan");
      const durasiEl = document.getElementById("durasi");
      const customDurasiContainer = document.getElementById("customDurasiContainer");
      const customDurasiEl = document.getElementById("customDurasi");
      const notaFormEl = document.getElementById("notaForm");
      const outputSectionEl = document.getElementById("outputSection");
      const notaOutputEl = document.getElementById("notaOutput");
      const dataAkunEl = document.getElementById("dataAkun");
      const akunErrorEl = document.getElementById("akunError");

      const pilihanDurasi = {
        renew: ["7 Day", "14 Day", "21 Day", "28 Day", "35 Day", "42 Day", "3 Bulan"],
        direct: ["7 Day", "1 Bulan", "6 Bulan", "12 Bulan"]
      };

      function renderPilihanDurasi() {
        const jenis = jenisLayananEl.value;
        durasiEl.innerHTML = '<option value="" selected disabled>-- Pilih Durasi --</option>';

        pilihanDurasi[jenis].forEach((durasi) => {
          const option = document.createElement("option");
          option.value = durasi;
          option.textContent = durasi;
          durasiEl.appendChild(option);
        });

        const customOption = document.createElement("option");
        customOption.value = "custom";
        customOption.textContent = "Custom Durasi";
        durasiEl.appendChild(customOption);

        customDurasiEl.value = "";
        customDurasiEl.required = false;
        customDurasiContainer.classList.add("hidden");
      }

      jenisLayananEl.addEventListener("change", renderPilihanDurasi);

      durasiEl.addEventListener("change", (event) => {
        const isCustom = event.target.value === "custom";
        customDurasiContainer.classList.toggle("hidden", !isCustom);
        customDurasiEl.required = isCustom;
        if (isCustom) customDurasiEl.focus();
      });

      dataAkunEl.addEventListener("input", () => akunErrorEl.classList.add("hidden"));

      notaFormEl.addEventListener("submit", (event) => {
        event.preventDefault();

        const selectedDurasi = durasiEl.value === "custom" ? customDurasiEl.value.trim() : durasiEl.value;
        if (!selectedDurasi) {
          customDurasiEl.focus();
          return;
        }

        const pemisah = dataAkunEl.value.indexOf("|");
        const email = pemisah >= 0 ? dataAkunEl.value.slice(0, pemisah).trim() : "";
        const password = pemisah >= 0 ? dataAkunEl.value.slice(pemisah + 1).trim() : "";

        if (!email || !password) {
          akunErrorEl.classList.remove("hidden");
          dataAkunEl.focus();
          return;
        }

        const jenis = jenisLayananEl.value;
        const angkaGaransi = Number.parseInt(document.getElementById("angkaGaransi").value, 10);
        const satuanGaransi = document.getElementById("satuanGaransi").value;
        const now = new Date();
        const opsiTanggal = { day: "numeric", month: "long", year: "numeric" };
        const tgl = now.toLocaleDateString("id-ID", opsiTanggal);
        const tglGaransi = new Date(now);

        if (satuanGaransi === "hari") {
          tglGaransi.setDate(tglGaransi.getDate() + angkaGaransi);
        } else {
          tglGaransi.setMonth(tglGaransi.getMonth() + angkaGaransi);
        }

        const tglGaransiFormat = tglGaransi.toLocaleDateString("id-ID", opsiTanggal);
        const service = jenis === "renew" ? "Capcut Pro Team (RENEW)" : "Capcut Pro (DIRECT)";

        const header = `
╭────〔 DATA AKUN CAPCUT 〕─
┊ ✨ Service : ${service}
┊ ⏳ Durasi  : ${selectedDurasi}
┊ 🛡️ Garansi : S/D ${tglGaransiFormat} (${angkaGaransi} ${satuanGaransi})
┊ 📅 Waktu   : ${tgl}
╰┈┈┈┈┈┈┈┈
- Email: ${email}
- Password: ${password}
╰┈┈┈┈┈┈┈┈`.trim();

        const panduanDasar = `

📖 CARA LOGIN & CEK EXPIRED TIM:
1. Login Capcut pakai Email & Password di atas.
👉 contoh: https://prnt.sc/uz61plJIdpkv | https://prnt.sc/UuQ1844Bv2f7
2. Klik Profil / Saya -> Klik tulisan "Pro" di samping username.
👉 contoh: https://prnt.sc/NHM6KWUWmjrT`;

        const tambahanRenew = `
3. Klik bagian "Tim", nanti akan muncul tampilan Tim Pro beserta tanggal expired tim nya.
👉 contoh: https://prnt.sc/vLvb2i1Q17Ta

📢 PENJELASAN SISTEM RENEW (7 HARI):
• Sistem Capcut membatasi durasi 1 tim maksimal 7 hari.
• Jika beli paket > 7 hari (misal 1 bulan), Anda akan otomatis ganti tim 4-5x setiap minggu secara berkala (tanpa ganti akun).
• Kuota Kredit AI Anda juga akan otomatis di-refill/diisi penuh kembali setiap minggu mengikuti siklus tim baru.
• Saat tim lama expired (H-1 / Hari H), tim baru akan diproses dalam waktu 2 jam - 1 hari.
• Mohon ingat tanggal expired tim Anda. Jika dalam 1x24 jam setelah expired tim belum diperbarui, silakan laporan ke seller.`;

        const syaratKetentuan = `

⚠️ SYARAT DAN KETENTUAN:
➥ Garansi utama saat pertama kali login.
➥ Hanya garansi Backfree (sistem), bukan karena kesalahan sendiri (disable/hack/pelanggaran).
➥ Maksimal login hanya untuk 2 Device.
➥ Disarankan Hapus Data aplikasi sebelum login (kecuali ada project penting).
➥ Login wajib via Email / Scan QR (PC).
➥ Ada kendala? Langsung hubungi admin.`;

        const infoRenew = `

🌐 Info Detail & Manfaat Lengkap: https://babay.web.id/informasi-capcut-renew`;

        notaOutputEl.value = jenis === "renew"
          ? header + panduanDasar + tambahanRenew + syaratKetentuan + infoRenew
          : header + panduanDasar + syaratKetentuan;

        notaOutputEl.readOnly = true;
        const editButton = document.getElementById("editButton");
        editButton.innerText = "EDIT";
        editButton.classList.remove("bg-amber-700");
        editButton.classList.add("bg-slate-700");
        outputSectionEl.classList.remove("hidden");
        outputSectionEl.scrollIntoView({ behavior: "smooth" });
      });

      document.getElementById("copyButton").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(notaOutputEl.value);
          alert("Nota berhasil disalin!");
        } catch (error) {
          notaOutputEl.select();
          document.execCommand("copy");
          alert("Nota berhasil disalin!");
        }
      });

      document.getElementById("editButton").addEventListener("click", function () {
        notaOutputEl.readOnly = false;
        notaOutputEl.focus();
        this.innerText = "MODE EDIT AKTIF";
        this.classList.remove("bg-slate-700");
        this.classList.add("bg-amber-700");
      });

      renderPilihanDurasi();
    </script>
  </body>
</html>
